<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,orientation=portrait" />
    <meta name="theme-color" content="#3367D6" />

    <title>My Saved Scores - UTH Stroke PWA</title>
    <link rel="stylesheet" href="../home.css">
    <link rel="manifest" href="../manifest.json" />
    <link rel="icon" href="../icons/icon.svg" />
  </head>

  <body>
    <div class="title-prompt-sticky">
      <h1>My Saved Exam Scores</h1>
    </div>

    <div class="page-contents-under-sticky">
      <div id="scores-container">
        <p id="no-scores-message">No saved exams yet. <br><br>Complete an exam to see your scores here.</p>
        <div id="scores-list" style="display: none;"></div>
      </div>
    </div>

    <div class="navbar">
      <a href="../index.html">
        <img src="../icons/home-icon.svg" alt="Home icon" style="width:50px; height:50px;">
        <p>Start An Exam</p>
      </a>
      <a href="../pages/nihss-cards.html">
        <img src="../icons/cards-empty-icon.svg" alt="Cards icon" style="width:50px; height:50px;">
        <p>NIHSS Cards</p>
      </a>
      <a class="active" href="./Saved-Scores.html">
        <img src="../icons/report-results-icon.svg" alt="My Results icon" style="width:50px; height:50px;">
        <p>My Saved Scores</p>
      </a>
      <a href="./more-info.html">
        <img src="../icons/ellipsis-more-icon.svg" alt="Info icon" style="width:50px; height:50px;">
        <p>More</p>
      </a>
    </div>

    <script src="../src/shared-exam-utils.js"></script>
    <script>
      /**
       * Get all completed exams from localStorage history
       */
      function getExamHistory() {
        try {
          return JSON.parse(localStorage.getItem('examHistory')) || [];
        } catch (e) {
          console.error('Failed to retrieve exam history:', e);
          return [];
        }
      }

      /**
       * Format date for display
       */
      function formatDate(isoString) {
        return formatDateForDisplay(isoString);
      }

      /**
       * Format exam name for display
       */
      function formatExamName(examName) {
        return formatExamNameForDisplay(examName);
      }

      /**
       * View details of a specific exam
       */
      function viewExamDetails(examID) {
        const history = getExamHistory();
        const exam = history.find(e => e.examID === examID);
        
        if (!exam) {
          alert('Exam not found');
          return;
        }

        // Get metadata if available
        const allMetadata = JSON.parse(localStorage.getItem('examMetadata')) || {};
        const metadata = allMetadata[examID] || {};

        // Create a detailed view
        let details = `
          <h2>${formatExamName(exam.examName)}</h2>
          <p><strong>Completed:</strong> ${formatDate(exam.completedAt)}</p>
          <p><strong>Exam ID:</strong> ${exam.examID}</p>
          <p><strong>Total Score:</strong> <span style="font-size: 1.3em; color: #2b8a3e; font-weight: bold;">${exam.totalScore}</span></p>
          
        `;

        // Add metadata if available
        if (Object.keys(metadata).length > 0) {
          details += '<h3>Exam Details:</h3>';
          if (metadata.patientName) details += `<p><strong>Name:</strong> ${metadata.patientName}</p>`;
          if (metadata.patientID) details += `<p><strong>ID #:</strong> ${metadata.patientID}</p>`;
          if (metadata.dateOfBirth) details += `<p><strong>DOB:</strong> ${metadata.dateOfBirth}</p>`;
          if (metadata.lastKnownWell) details += `<p><strong>Last Known Well:</strong> ${metadata.lastKnownWell}</p>`;
          if (metadata.nihssScore) details += `<p><strong>NIHSS Score:</strong> ${metadata.nihssScore} / 42</p>`;
          if (metadata.modifiedRankin) details += `<p><strong>Modified Rankin:</strong> ${metadata.modifiedRankin}</p>`;
          if (metadata.interval) details += `<p><strong>Interval:</strong> ${metadata.interval}</p>`;
          if (metadata.location) details += `<p><strong>Location:</strong> ${metadata.location}</p>`;
          if (metadata.notes) details += `<p><strong>Notes:</strong> ${metadata.notes}</p>`;
        }

        details += `
          <h3>Answers Breakdown:</h3>
          <div class="answer-breakdown">
        `;

        if (exam.answers && Object.keys(exam.answers).length > 0) {
          Object.entries(exam.answers).forEach(([questionId, answer]) => {
            const questionTitle = getQuestionTitle(questionId);
            let answerDetail = `<em>Answer: ${answer.text}</em>`;
            
            // Add UN reason text if it exists
            if (answer['un-reason-text']) {
              answerDetail += `<br><span style="font-size: 0.9em; color: #555; margin-top: 0.25rem; display: block;"><em>Reason: ${answer['un-reason-text']}</em></span>`;
            }
            
            details += `
              <div class="answer-item">
                <strong>${questionTitle}</strong><br>
                ${answer.points} point${answer.points !== 1 ? 's' : ''}<br>
                ${answerDetail}
              </div>
            `;
          });
        } else {
          details += '<p>No answers recorded for this exam.</p>';
        }

        details += '</div>';

        // Display in a modal/overlay
        const modal = document.createElement('div');
        modal.id = 'exam-details-modal';
        modal.className = 'exam-details-modal';

        const modalContent = document.createElement('div');
        modalContent.className = 'exam-details-modal-content';

        modalContent.innerHTML = `
          ${details}
          <div class="modal-button-container">
            <button class="modal-button modal-close-btn" onclick="document.getElementById('exam-details-modal').remove()">Close</button>
            <button class="modal-button modal-edit-btn" onclick="editExam('${examID}')">Edit</button>
            <button class="modal-button modal-delete-btn" onclick="deleteExam('${examID}')">Delete Exam</button>
          </div>
        `;

        // Close modal when clicking on the overlay (but not the content)
        modal.addEventListener('click', function(e) {
          if (e.target === modal) {
            modal.remove();
          }
        });

        modal.appendChild(modalContent);
        document.body.appendChild(modal);
        document.body.appendChild(modal);
      }

      /**
       * Delete an exam from history
       */
      function deleteExam(examID) {
        if (!confirm('Are you sure you want to delete this exam record?')) {
          return;
        }

        try {
          let history = JSON.parse(localStorage.getItem('examHistory')) || [];
          history = history.filter(exam => exam.examID !== examID);
          localStorage.setItem('examHistory', JSON.stringify(history));
          
          // Close modal and refresh display
          const modal = document.getElementById('exam-details-modal');
          if (modal) modal.remove();
          
          renderScores();
        } catch (e) {
          console.error('Failed to delete exam:', e);
          alert('Failed to delete exam');
        }
      }

      /**
       * Edit an exam's metadata
       */
      function editExam(examID) {
        // Store the exam ID to be edited and navigate to score-results
        try {
          sessionStorage.setItem('editingExamID', examID);
          window.location.href = './score-results.html';
        } catch (e) {
          console.error('Failed to open exam for editing:', e);
          alert('Failed to open exam for editing');
        }
      }

      /**
       * Clear all exam history
       */
      function clearAllHistory() {
        if (!confirm('Are you sure you want to delete ALL exam records? This cannot be undone.')) {
          return;
        }

        try {
          localStorage.removeItem('examHistory');
          renderScores();
        } catch (e) {
          console.error('Failed to clear history:', e);
          alert('Failed to clear history');
        }
      }

      /**
       * Generate text-only version of exam results for sharing
       */
      function generateExamShareText(examID) {
        const history = getExamHistory();
        const exam = history.find(e => e.examID === examID);
        
        if (!exam) return '';

        const allMetadata = JSON.parse(localStorage.getItem('examMetadata')) || {};
        const metadata = allMetadata[examID] || {};

        return generateShareText(exam, metadata);
      }

      /**
       * Share exam from the table view (button in action column)
       */
      function shareExamFromList(examID) {
        const text = generateExamShareText(examID);
        openShareModal(text, examID);
      }

      /**
       * Share exam from the modal view (button next to heading)
       */
      function shareExamFromModal(examID) {
        const text = generateExamShareText(examID);
        openShareModal(text, examID);
      }

      /**
       * Open share modal with the exam text
       */
      function openShareModal(text, examID) {
        const modal = document.createElement('div');
        modal.className = 'share-modal-overlay';
        modal.id = 'share-results-modal';

        const content = document.createElement('div');
        content.className = 'share-modal-content';

        content.innerHTML = `
          <div class="share-modal-header">
            <h3>Share Exam Results</h3>
            <button class="share-modal-close" onclick="document.getElementById('share-results-modal').remove()">✕</button>
          </div>
          <div class="share-modal-text">${text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
          <div class="share-modal-actions">
            <button class="share-modal-btn" onclick="copyShareText('${examID}')">Copy to Clipboard</button>
            <button class="share-modal-btn" onclick="downloadShareText('${examID}')">Download as Text</button>
            <button class="share-modal-btn share-modal-close-btn" onclick="document.getElementById('share-results-modal').remove()">Close</button>
          </div>
        `;

        modal.addEventListener('click', function(e) {
          if (e.target === modal) {
            modal.remove();
          }
        });

        modal.appendChild(content);
        document.body.appendChild(modal);
      }

      /**
       * Copy share text to clipboard
       */
      function copyShareText(examID) {
        const text = generateExamShareText(examID);
        copyToClipboard(text).then(() => {
          alert('Results copied to clipboard!');
        }).catch(err => {
          console.error('Failed to copy:', err);
          alert('Failed to copy to clipboard');
        });
      }

      /**
       * Download share text as file
       */
      function downloadShareText(examID) {
        const history = getExamHistory();
        const exam = history.find(e => e.examID === examID);
        const text = generateExamShareText(examID);
        
        downloadTextAsFile(text, `stroke-assessment-${examID}.txt`);
      }

      /**
       * Render the scores list
       */
      function renderScores() {
        const history = getExamHistory();
        const scoresList = document.getElementById('scores-list');
        const noScoresMessage = document.getElementById('no-scores-message');

        if (history.length === 0) {
          scoresList.style.display = 'none';
          noScoresMessage.style.display = 'block';
          return;
        }

        noScoresMessage.style.display = 'none';
        scoresList.style.display = 'block';

        // Sort by completion date (newest first)
        const sorted = [...history].sort((a, b) => 
          new Date(b.completedAt) - new Date(a.completedAt)
        );

        let html = '<table class="scores-table">';
        html += `
          <thead>
            <tr>
              <th>Exam</th>
              <th>Score</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
        `;

        sorted.forEach(exam => {
          html += `
            <tr>
              <td class="scores-table-exam-name">${formatExamName(exam.examName)}</td>
              <td class="scores-table-score">${exam.totalScore}</td>
              <td class="scores-table-date">${formatDate(exam.completedAt)}</td>
              <td class="scores-table-action">
                <button class="view-exam-btn" onclick="viewExamDetails('${exam.examID}')">View</button>
                <button class="share-exam-btn" onclick="shareExamFromList('${exam.examID}')">Share</button>
              </td>
            </tr>
          `;
        });

        html += `
          </tbody>
        </table>
        <div class="clear-history-container">
          <button class="clear-history-btn" onclick="clearAllHistory()">Clear All History</button>
        </div>
        `;

        scoresList.innerHTML = html;
      }

      // Initialize on page load
      document.addEventListener('DOMContentLoaded', renderScores);
    </script>
  </body>
</html>
