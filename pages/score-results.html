<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,orientation=portrait" />
    <meta name="theme-color" content="#3367D6" />

    <title>Exam Results - UTH Stroke PWA</title>
    <link rel="stylesheet" href="../home.css">
    <link rel="manifest" href="../manifest.json" />
    <link rel="icon" href="../icons/icon.svg" />
  </head>

  <body>
    <div class="title-prompt-sticky">
      <h1><a hhref="#" onclick="history.back(); return false;"><img class="small-badge" src="../icons/go-back-arrow.svg" alt="go back arrow" /></a>
        Exam Results Details</h1>
    </div>

    <div class="page-contents-under-sticky">
      <div id="exam-metadata" class="exam-metadata-form">
        <!-- Metadata fields will be populated here -->
      </div>

      <div id="exam-answers-table" class="exam-answers-section">
        <!-- Answers table will be populated here -->
      </div>

      <div class="exam-complete-container">
        <button class="complete-exam-btn" id="editBtn" onclick="editExamResponses()">Edit Responses</button>
        <button class="complete-exam-btn" id="saveBtn" onclick="finalizeAndSaveExam()">Save Exam Details</button>
      </div>
    </div>

    <div class="navbar">
      <a href="../index.html">
        <img src="../icons/home-icon.svg" alt="Home icon" style="width:50px; height:50px;">
        <p>Start An Exam</p>
      </a>
      <a href="./nihss-cards.html">
        <img src="../icons/cards-empty-icon.svg" alt="Cards icon" style="width:50px; height:50px;">
        <p>NIHSS Cards</p>
      </a>
      <a class="active" href="./Saved-Scores.html">
        <img src="../icons/report-results-icon.svg" alt="My Results icon" style="width:50px; height:50px;">
        <p>My Saved Scores</p>
      </a>
      <a href="./more-info.html">
        <img src="../icons/ellipsis-more-icon.svg" alt="Info icon" style="width:50px; height:50px;">
        <p>More</p>
      </a>
    </div>

    <script src="../src/score-results.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
