<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#3367D6" />

    <title>UTH Stroke PWA — Starter</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon.svg" />

    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial; margin: 0; padding: 2rem; background: #f7f9fc; color: #111; }
      header { display:flex; gap:1rem; align-items:center }
      .badge { width:48px; height:48px }
      main { margin-top:1.5rem }
      .status { margin-top:1rem; color:#2b8a3e }
    </style>
  </head>
  <body>
    <header>
      <img class="badge" src="/icons/icon.svg" alt="app icon" />
      <h1>UTH Stroke PWA — Starter</h1>
    </header>

    <main>
      <p>This is a minimal Progressive Web App starter. It includes a web app manifest and a service worker that caches core assets.</p>

      <div class="status" id="sw-status">Service worker: not registered</div>

      <p>To test locally run a simple HTTP server and open <a href="http://localhost:8080">http://localhost:8080</a>.</p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
